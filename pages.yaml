# codewiki page taxonomy for codewiki, generated by `codewiki init`.
#
# `include` entries are package path prefixes taken from the indexed code graph.
# Edit freely: rename pages, merge or split groups, add `domain:` kinds. Re-run
# `codewiki assemble --writer` after any change.

pages:
  - slug: overview
    title: Overview
    order: 1
    include:
      - codewiki

  - slug: writer
    title: Writer
    order: 2
    domain: [ws_event]
    include:
      - codewiki/writer

  - slug: indexer
    title: Indexer
    order: 3
    include:
      - codewiki/indexer

  - slug: assembly
    title: Assembly
    order: 4
    include:
      - codewiki/assembly

  - slug: generator
    title: Generator
    order: 5
    include:
      - codewiki/generator

  - slug: store
    title: Store
    order: 6
    include:
      - codewiki/store

  - slug: server
    title: Server
    order: 7
    include:
      - codewiki/server

  - slug: testing
    title: Testing
    order: 8
    keep_tests: true
    include:
      - tests
