<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codewiki viewer</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #0b0f14; --panel: #10151c; --border: #232b36; --text: #d7dee6; --muted: #8b98a8;
    --accent: #4da3ff; --code-bg: #161d26;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f6f8fa; --border: #d8dee4; --text: #1a1f26; --muted: #5b6673;
      --accent: #1868c9; --code-bg: #f1f3f5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
              font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #layout { display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 280px; flex: none; border-right: 1px solid var(--border);
             background: var(--panel); overflow-y: auto; padding: 12px; }
  #sidebar h1 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em;
                color: var(--muted); margin: 4px 8px 12px; }
  #search { width: 100%; padding: 6px 8px; margin-bottom: 10px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  #pages a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--text);
             text-decoration: none; font-size: 14px; }
  #pages a:hover { background: var(--border); }
  #pages a.active { background: var(--accent); color: #fff; }
  #refresh-row { display: flex; align-items: center; gap: 8px; margin-top: 14px;
                 padding-top: 12px; border-top: 1px solid var(--border); }
  #refresh-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
                 background: var(--bg); color: var(--text); cursor: pointer; font-size: 13px; }
  #refresh-status { font-size: 12px; color: var(--muted); }
  #main { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 900px; }
  #content { overflow-x: auto; }
  #content h1 { font-size: 28px; }
  #content h2 { font-size: 20px; margin-top: 2em; border-bottom: 1px solid var(--border);
                padding-bottom: .3em; }
  #content a { color: var(--accent); }
  #content pre { background: var(--code-bg); padding: 12px; border-radius: 8px;
                 overflow-x: auto; }
  #content code { background: var(--code-bg); padding: .15em .35em; border-radius: 4px;
                  font-size: .9em; }
  #content pre code { background: none; padding: 0; }
  #content table { border-collapse: collapse; width: 100%; margin: 1em 0; display: block;
                   overflow-x: auto; }
  #content th, #content td { border: 1px solid var(--border); padding: 6px 10px;
                             text-align: left; font-size: 13.5px; }
  #content .mermaid { background: var(--panel); border-radius: 8px; padding: 12px; }
  #empty { color: var(--muted); padding: 40px; }
</style>
</head>
<body>
<div id="layout">
  <nav id="sidebar">
    <h1>Wiki</h1>
    <input id="search" placeholder="Search pages...">
    <div id="pages"></div>
    <div id="refresh-row">
      <button id="refresh-btn">Refresh</button>
      <span id="refresh-status"></span>
    </div>
  </nav>
  <main id="main"><div id="content"></div></main>
</div>

<script>
// Point at a different backend origin with ?api=http://host:port ; same-origin by default so
// the viewer works when served next to app.py (e.g. `uvicorn codewiki.server.app:app`).
const API = new URLSearchParams(location.search).get("api") || "";
const $ = (sel) => document.querySelector(sel);

let manifest = { pages: [] };
let currentSlug = null;

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  return res.json();
}

function slugify(text) {
  return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

async function loadManifest() {
  manifest = await api("/api/wiki/manifest");
  renderSidebar();
  if (!manifest.available) {
    $("#content").innerHTML = "<div id='empty'>No wiki generated yet — run "
      + "<code>codewiki update</code> in the repo you want to document, or click Refresh "
      + "(requires a local LLM server).</div>";
    return;
  }
  const first = manifest.pages.slice().sort((a, b) => (a.order || 0) - (b.order || 0))[0];
  if (first) loadPage(first.slug);
}

function renderSidebar() {
  const pages = (manifest.pages || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  $("#pages").innerHTML = pages.map(p =>
    `<a href="#" data-slug="${p.slug}">${p.title}</a>`).join("");
  for (const a of document.querySelectorAll("#pages a")) {
    a.onclick = (e) => { e.preventDefault(); loadPage(a.dataset.slug); };
  }
  highlightActive();
}

function highlightActive() {
  for (const a of document.querySelectorAll("#pages a")) {
    a.classList.toggle("active", a.dataset.slug === currentSlug);
  }
}

async function loadPage(slug) {
  const page = await api("/api/wiki/page/" + encodeURIComponent(slug));
  if (page.error) {
    $("#content").innerHTML = `<div id="empty">${page.error}</div>`;
    return;
  }
  currentSlug = slug;
  highlightActive();
  const rawHtml = marked.parse(page.markdown, { headerIds: false, mangle: false });
  $("#content").innerHTML = DOMPurify.sanitize(rawHtml, { ADD_TAGS: ["br"] });
  interceptLinks();
  await renderMermaid();
  $("#main").scrollTop = 0;
}

function interceptLinks() {
  for (const a of document.querySelectorAll("#content a")) {
    const href = a.getAttribute("href") || "";
    if (href.startsWith("#")) continue; // in-page anchor, let the browser handle it
    if (/^[\w.\-\/]+\.md(#.*)?$/.test(href)) {
      const [target, anchor] = href.split("#");
      const slug = target.replace(/\.md$/, "");
      a.addEventListener("click", (e) => {
        e.preventDefault();
        loadPage(slug).then(() => {
          if (anchor) {
            const heading = [...document.querySelectorAll("#content h1,h2,h3")]
              .find(h => slugify(h.textContent) === anchor);
            if (heading) heading.scrollIntoView();
          }
        });
      });
    }
  }
}

let mermaidReady = false;
async function renderMermaid() {
  const blocks = document.querySelectorAll("#content pre code.language-mermaid");
  if (!blocks.length) return;
  if (!mermaidReady) {
    mermaid.initialize({ startOnLoad: false, theme: "dark" });
    mermaidReady = true;
  }
  let i = 0;
  for (const block of blocks) {
    const id = "mmd-" + (i++);
    const { svg } = await mermaid.render(id, block.textContent);
    const wrap = document.createElement("div");
    wrap.className = "mermaid";
    wrap.innerHTML = svg;
    block.closest("pre").replaceWith(wrap);
  }
}

// ------------------------------------------------------------------ search
let searchTimer = null;
$("#search").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value;
  searchTimer = setTimeout(async () => {
    if (!q) { renderSidebar(); return; }
    const { results } = await api("/api/wiki/search?q=" + encodeURIComponent(q));
    $("#pages").innerHTML = results.map(r =>
      `<a href="#" data-slug="${r.slug}">${r.title}<br><small style="color:var(--muted)">`
      + `${r.snippet}</small></a>`).join("") || "<div style='color:var(--muted);padding:8px'>No matches</div>";
    for (const a of document.querySelectorAll("#pages a")) {
      a.onclick = (e2) => { e2.preventDefault(); loadPage(a.dataset.slug); };
    }
  }, 200);
});

// ------------------------------------------------------------------ refresh
let pollTimer = null;
async function refreshOnce() {
  const status = await api("/api/wiki/refresh/status");
  if (status.is_running) {
    const pct = Math.round((status.pct || 0) * 100) / 100;
    $("#refresh-status").textContent = `${status.stage || "…"} ${pct}%`;
  } else {
    $("#refresh-status").textContent = status.state === "done" ? "up to date"
      : status.state === "error" ? `error: ${status.error || ""}` : "";
    clearInterval(pollTimer);
    pollTimer = null;
    if (status.state === "done") loadManifest();
  }
}

$("#refresh-btn").addEventListener("click", async () => {
  const res = await api("/api/wiki/refresh", { method: "POST" });
  if (res.error) { $("#refresh-status").textContent = res.error; return; }
  $("#refresh-status").textContent = "starting...";
  pollTimer = setInterval(refreshOnce, 2500);
});

loadManifest();
refreshOnce();
</script>
</body>
</html>
